<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Josh Arena</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── CSS variables for theming ── */
    :root {
      --bg:           #12082e;
      --glow:         #2a0f6b;
      --card-bg:      rgba(255, 255, 255, 0.04);
      --card-border:  rgba(255, 255, 255, 0.1);
      --card-shadow:  0 8px 40px rgba(0, 0, 0, 0.45);
      --name-color:   #fff;
      --bio-color:    rgba(255, 255, 255, 0.65);
      --footer-color: rgba(255, 255, 255, 0.25);
      --outline-bg:   rgba(255, 255, 255, 0.05);
      --outline-fg:   #fff;
      --outline-border: rgba(255, 255, 255, 0.15);
      --outline-hover-bg: rgba(255, 255, 255, 0.1);
      --outline-hover-border: rgba(255, 255, 255, 0.3);
      --toggle-bg:    rgba(255, 255, 255, 0.1);
      --toggle-fg:    rgba(255, 255, 255, 0.7);
      --toggle-hover: rgba(255, 255, 255, 0.15);
    }

    body.light {
      --bg:           #f0f4f8;
      --glow:         #c8e6ff;
      --card-bg:      rgba(255, 255, 255, 0.85);
      --card-border:  rgba(0, 0, 0, 0.08);
      --card-shadow:  0 8px 40px rgba(0, 0, 0, 0.12);
      --name-color:   #12082e;
      --bio-color:    rgba(0, 0, 0, 0.55);
      --footer-color: rgba(0, 0, 0, 0.3);
      --outline-bg:   rgba(0, 0, 0, 0.04);
      --outline-fg:   #12082e;
      --outline-border: rgba(0, 0, 0, 0.15);
      --outline-hover-bg: rgba(0, 0, 0, 0.08);
      --outline-hover-border: rgba(0, 0, 0, 0.3);
      --toggle-bg:    rgba(0, 0, 0, 0.08);
      --toggle-fg:    rgba(0, 0, 0, 0.55);
      --toggle-hover: rgba(0, 0, 0, 0.13);
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--name-color);
      padding: 2rem 1rem;
      transition: background 0.3s ease;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 70% 60% at 50% 40%, var(--glow) 0%, transparent 70%);
      pointer-events: none;
      transition: background 0.3s ease;
    }

    /* ── Toggle button ── */
    .toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.85rem;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      background: var(--toggle-bg);
      color: var(--toggle-fg);
      transition: background 0.2s ease, color 0.2s ease;
      z-index: 10;
    }

    .toggle:hover { background: var(--toggle-hover); }

    .toggle svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    /* Hide the icon not in use */
    body:not(.light) .icon-sun  { display: none; }
    body.light        .icon-moon { display: none; }

    /* ── Card ── */
    .card {
      position: relative;
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 2.5rem 2rem 2.25rem;
      text-align: center;
      backdrop-filter: blur(12px);
      box-shadow: var(--card-shadow);
      transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      border-radius: 20px 20px 0 0;
      background: linear-gradient(90deg, #00ff5a, #00ffd0);
    }

    .logo-wrap { margin-bottom: 1.75rem; }
    .logo-wrap img { height: 36px; width: auto; filter: brightness(1.05); }

    .divider {
      width: 40px;
      height: 2px;
      background: linear-gradient(90deg, #00ff5a, #00ffd0);
      border-radius: 2px;
      margin: 1.25rem auto;
    }

    .name {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--name-color);
      transition: color 0.3s ease;
    }

    .title {
      font-size: 0.9rem;
      font-weight: 500;
      color: #00bb56;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 0.35rem;
    }

    body:not(.light) .title { color: #00ff5a; }

    .bio {
      margin-top: 1rem;
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--bio-color);
      transition: color 0.3s ease;
    }

    .links {
      margin-top: 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 0.85rem 1.25rem;
      border-radius: 12px;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      border: 1px solid transparent;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
    }

    .btn-primary {
      background: linear-gradient(135deg, #00ff5a 0%, #00d4a8 100%);
      color: #12082e;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #1aff6a 0%, #10e4b8 100%);
    }

    .btn-outline {
      background: var(--outline-bg);
      color: var(--outline-fg);
      border-color: var(--outline-border);
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-outline:hover {
      background: var(--outline-hover-bg);
      border-color: var(--outline-hover-border);
    }

    .btn svg { width: 18px; height: 18px; flex-shrink: 0; }

    .footer {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: var(--footer-color);
      transition: color 0.3s ease;
    }
  </style>
</head>
<body>

  <!-- Dark/Light toggle -->
  <button class="toggle" onclick="document.body.classList.toggle('light'); localStorage.setItem('theme', document.body.classList.contains('light') ? 'light' : 'dark');" aria-label="Toggle colour mode">
    <!-- Sun icon (shown in dark mode) -->
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
      <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
    </svg>
    <!-- Moon icon (shown in light mode) -->
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
    <span class="icon-sun">Light</span>
    <span class="icon-moon">Dark</span>
  </button>

  <div class="card">
    <div class="logo-wrap">
      <a href="https://delinea.com" target="_blank" rel="noopener">
        <img
          src="https://delinea.com/hubfs/Delinea/logos/Wordmark/delinea-logo-wordmark-web-green.svg"
          alt="Delinea"
        />
      </a>
    </div>

    <h1 class="name">John Doe, CIAM</h1>
    <p class="title">Sales Engineer<br>Certified Identity &amp; Access Manager</p>

    <div class="divider"></div>

    <p class="bio">Bridging the gap between cybersecurity and business&nbsp;— one demo at a time.</p>

    <nav class="links">
      <a class="btn btn-primary" href="https://delinea.com/the-delinea-difference" target="_blank" rel="noopener">
        Deploy in weeks, not months.
      </a>

      <a class="btn btn-outline" href="https://www.linkedin.com/company/delinea/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M20.447 20.452H17.21v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.999V9h3.106v1.561h.044c.433-.82 1.49-1.684 3.066-1.684 3.278 0 3.882 2.157 3.882 4.962v6.613zM5.337 7.433a1.8 1.8 0 1 1 0-3.6 1.8 1.8 0 0 1 0 3.6zM6.916 20.452H3.756V9h3.16v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
        </svg>
        LinkedIn
      </a>

      <a class="btn btn-outline" href="https://delinea.com/products" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="18" height="18">
          <text x="2" y="20" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#00ff5a">D</text>
        </svg>
        See Delinea's solutions in action!
      </a>
    </nav>

    <p class="footer">© 2026 Josh Arena</p>
  </div>

  <script>
    // Restore saved preference on load
    if (localStorage.getItem('theme') === 'light') {
      document.body.classList.add('light');
    }
  </script>
</body>
</html>
